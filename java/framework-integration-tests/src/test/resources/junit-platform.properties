# Mocha semantics for the ported suites (see README.md, "Layout contract"):
# one instance per class, so that @BeforeAll methods of @Nested classes can be instance methods (mocha's before)
# and fields hold the state of a describe block
junit.jupiter.testinstance.lifecycle.default = per_class
# mocha runs its, describes and contexts in declaration order: suites state that order with @Order
junit.jupiter.testmethod.order.default = org.junit.jupiter.api.MethodOrderer$OrderAnnotation
junit.jupiter.testclass.order.default = org.junit.jupiter.api.ClassOrderer$OrderAnnotation
